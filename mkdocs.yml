site_name: Operation Molasses (Pekmez)
site_description: Zencefil Efendi's Advanced Cyber Dowry Chest (State-Actor Level
  Knowledge Base)
site_author: Zencefil Efendi
theme:
  name: material
  palette:
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: deep orange
    accent: amber
    toggle:
      icon: material/weather-night
      name: Switch to light mode
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: deep orange
    accent: amber
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  features:
  - search.suggest
  - search.highlight
  - navigation.tabs
  - navigation.sections
  - navigation.top
markdown_extensions:
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.superfences
- admonition
- pymdownx.details
- pymdownx.tasklist:
    custom_checkbox: true
plugins:
- search
